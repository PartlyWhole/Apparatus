<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apparatus</title>
<style>
  :root { --bg:#faf8f4; --fg:#1d1d1f; --muted:#6b6b70; --card:#fff; --line:#e4e0d8; --accent:#2f6fde; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151517; --fg:#f2f2f2; --muted:#9a9aa0; --card:#1f1f22; --line:#333338; --accent:#7aa7ff; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,sans-serif; }
  main { max-width:880px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:2.5rem; margin:0 0 4px; letter-spacing:-0.02em; }
  p.sub { color:var(--muted); margin:0 0 32px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
  a.toy { display:block; padding:20px; background:var(--card); border:1px solid var(--line); border-radius:12px; color:inherit; text-decoration:none; transition:border-color .15s, transform .15s; }
  a.toy:hover { border-color:var(--accent); transform:translateY(-2px); }
  a.toy h2 { margin:0 0 6px; font-size:1.15rem; }
  a.toy p { margin:0; color:var(--muted); font-size:.92rem; }
</style>
</head>
<body>
<main>
  <h1>Apparatus</h1>
  <p class="sub">A library of interactive toys.</p>
  <div class="grid">
    <a class="toy" href="Slope.html"><h2>Slope Lab</h2><p>Explore the slope of a line.</p></a>
  </div>
</main>
</body>
</html>
