<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;600;700&display=swap">
<link rel="stylesheet" href="engine/exercise.css?v=4">
<body class="analytics">
<main id="main"></main>
<script src="engine/exercise.js?v=11"></script>
<script>
// analytics.html#<exercise id> — loads exercises/<id>.js and shows its analytics (engine: Apparatus.analytics)
(function () {
  const id = (location.hash.slice(1) || '').replace(/[^a-z0-9-]/gi, '');
  const main = document.getElementById('main');
  if (!id) { main.innerHTML = '<p class="empty">No exercise.</p>'; return; }
  // shared exercise libraries first (definitions may use them), then the definition
  const lib = document.createElement('script');
  lib.src = 'exercises/lib/places.js?v=8';
  lib.onload = () => document.body.appendChild(s);
  const s = document.createElement('script');
  s.src = `exercises/${id}.js?v=1`;
  s.onload = () => Apparatus.analytics(Apparatus.defs[id], main, `exercises/${id}.html`);
  s.onerror = () => { main.innerHTML = '<p class="empty">No exercise.</p>'; };
  document.body.appendChild(lib);
})();
</script>
</body>
