<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Fraction Board Exercises</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;600;700&display=swap">
<link rel="stylesheet" href="fraction-board.css">
<style>
/* Layout: one calm column; scene tabs, a single line of guidance, the board on a card, and a quiet row of tools */
:root {
  --bg: #EEF2F7;
  --surface: #FFFFFF;
  --ink: #13203A;
  --muted: #5F6F8A;
  --line: #D3DBE7;
  --chip: #EAEFF6;
  --accent: #2648C9;
  --on-accent: #FFFFFF;
  --amber: #F2B630;
  --amber-text: #B07800;
  --on-amber: #2E2200;
  --bad: #C2413A;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1120; --surface: #131C2E; --ink: #E4EAF4; --muted: #95A4BF; --line: #26344F; --chip: #1C2840;
    --accent: #8AA8FF; --on-accent: #0B1120; --amber: #F2B630; --amber-text: #F2B630; --on-amber: #2E2200; --bad: #FF8F85;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1120; --surface: #131C2E; --ink: #E4EAF4; --muted: #95A4BF; --line: #26344F; --chip: #1C2840;
  --accent: #8AA8FF; --on-accent: #0B1120; --amber: #F2B630; --amber-text: #F2B630; --on-amber: #2E2200; --bad: #FF8F85;
  color-scheme: dark;
}
:root {
  --fb-ink: var(--ink); --fb-muted: var(--muted); --fb-chip: var(--chip); --fb-surface: var(--surface); --fb-line: var(--line);
  --fb-accent: var(--accent); --fb-amber: var(--amber); --fb-amber-text: var(--amber-text); --fb-on-amber: var(--on-amber);
  --fb-bad: var(--bad); --fb-mono: var(--f-mono);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
.page {
  min-height: 100%;
  max-width: 60rem; margin: 0 auto;
  padding-inline: 16px; padding-block: 28px;
  display: flex; flex-direction: column; justify-content: center; gap: 18px;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.tabs button {
  border: 0; background: transparent; color: var(--muted);
  padding: 7px 14px; border-radius: 999px; font-size: 0.95rem;
}
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 0 0 1px var(--line); }

.say { text-align: center; color: var(--muted); min-height: 1.5em; margin: 0; text-wrap: balance; }

.card { background: var(--surface); border-radius: 18px; box-shadow: 0 0 0 1px var(--line), 0 10px 30px rgba(10, 20, 40, 0.06); overflow-x: auto; }

.below { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; min-height: 52px; }
.value { font-family: var(--f-mono); color: var(--muted); font-size: 1.1rem; }
.value .fb-vfrac { vertical-align: middle; }
.fb-vfrac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.25; }
.fb-vfrac > span { padding: 0 4px; }
.fb-vfrac > span:first-child { border-bottom: 2px solid currentColor; }
.value sup { font-size: 0.6em; line-height: 0; }
.value i { color: var(--accent); }

.tools { display: flex; gap: 8px; }
.icon {
  width: 42px; height: 42px; border-radius: 50%; border: 0;
  background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line);
  font-size: 1.15rem; line-height: 1;
}
.icon:hover:not(:disabled) { box-shadow: inset 0 0 0 1.5px var(--accent); color: var(--accent); }
.icon:disabled { opacity: 0.3; cursor: default; }
.pill {
  height: 42px; padding: 0 16px; border-radius: 999px; border: 0;
  background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); font-weight: 700;
}
.pill[hidden] { display: none; }

.build { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.build[hidden] { display: none; }
.build input {
  width: 9rem; height: 42px; padding: 0 12px; border-radius: 999px;
  border: 0; box-shadow: inset 0 0 0 1px var(--line); background: var(--surface); font-family: var(--f-mono);
}
.build input:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--accent); }

.hint { text-align: center; min-height: 1.4em; margin: 0; font-size: 0.9rem; color: var(--ink); transition: opacity 0.3s; }
.hint:empty { opacity: 0; }
</style>

<style>
/* Exercise panel */
.page { justify-content: flex-start; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.home { color: var(--muted); text-decoration: none; font-size: 0.9rem; }
.home:hover { color: var(--accent); }
.score { color: var(--muted); font-size: 0.9rem; font-family: var(--f-mono); }
.task { text-align: center; margin: 0; font-size: clamp(1.1rem, 2.6vw, 1.35rem); font-weight: 700; text-wrap: balance; }
.task .goal { display: inline-flex; vertical-align: middle; margin-left: 6px; font-family: var(--f-mono); color: var(--accent); }
.fb-feedback { text-align: center; margin: 0; min-height: 1.5em; color: var(--muted); text-wrap: balance; }
.fb-feedback.good { color: #17804F; font-weight: 700; }
.fb-feedback.bad { color: var(--bad); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fb-feedback.good { color: #4CC38A; } }
:root[data-theme="dark"] .fb-feedback.good { color: #4CC38A; }
.actions { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.actions .primary { height: 42px; padding: 0 20px; border-radius: 999px; border: 0; background: var(--accent); color: var(--on-accent); font-weight: 700; }
.actions .primary:disabled { opacity: 0.4; cursor: default; }
</style>
<div class="page">
  <div class="top">
    <a class="home" href="../index.html" aria-label="Apparatus">←</a>
    <span class="score" id="score"></span>
  </div>
  <nav class="tabs" role="tablist" aria-label="Exercises" id="tabs"></nav>
  <p class="task" id="task"></p>
  <div class="card"><div id="board" aria-label="Fractions"></div></div>
  <div class="below">
    <div class="tools">
      <button type="button" class="icon" id="undo" title="Undo" aria-label="Undo">↶</button>
      <button type="button" class="icon" id="reset" title="Start over" aria-label="Start over">↺</button>
    </div>
    <button type="button" class="pill" id="combine" hidden>Combine</button>
  </div>
  <form class="build" id="build" hidden autocomplete="off">
    <input id="factor" type="text" inputmode="numeric" placeholder="factor" aria-label="Factor to multiply by">
    <button type="button" class="icon" data-row="num" title="Multiply (add on top)" aria-label="Multiply: add on top">↑</button>
    <button type="button" class="icon" data-row="den" title="Divide (add on the bottom)" aria-label="Divide: add on the bottom">↓</button>
  </form>
  <p class="hint" id="hint" role="status"></p>
  <p class="fb-feedback" id="fbk" aria-live="polite"></p>
  <div class="actions">
    <button type="button" class="primary" id="check">Check</button>
    <button type="button" class="pill" id="new">Next →</button>
  </div>
</div>

<script src="fraction-board.js"></script>
<script>
(function () {
  const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = a => a[ri(0, a.length - 1)];
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = ri(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const gcd = (a, b) => { while (b) [a, b] = [b, a % b]; return a; };
  const bgcd = (a, b) => { while (b) [a, b] = [b, a % b]; return a; };
  const fh = FractionBoard.html, pf = FractionBoard.parseFactor;

  // exact value of a number-like factor as [top, bottom] BigInts
  function ratio(f) {
    if (f.t === 'n') return [BigInt(f.d), 10n ** BigInt(f.s)];
    if (f.t === 'p') return f.e >= 0 ? [10n ** BigInt(f.e), 1n] : [1n, 10n ** BigInt(-f.e)];
    return [1n, 1n];
  }
  const isUnity = f => f.t !== 'u' && f.t !== 'b' && (() => { const [a, b] = ratio(f); return a === b; })();
  // everything on the board as one big fraction: numbers top/bottom (not reduced) and unit counts
  function totals(st) {
    let n = 1n, d = 1n; const units = {}; let count = 0;
    st.fracs.forEach(fr => {
      fr.num.forEach(f => { if (isUnity(f)) return; count++; if (f.t === 'u') units[f.u + '^' + f.k] = (units[f.u + '^' + f.k] || 0) + 1; else { const [a, b] = ratio(f); n *= a; d *= b; } });
      fr.den.forEach(f => { if (isUnity(f)) return; count++; if (f.t === 'u') units[f.u + '^' + f.k] = (units[f.u + '^' + f.k] || 0) - 1; else { const [a, b] = ratio(f); n *= b; d *= a; } });
    });
    return { n, d, units, count };
  }
  function unitsOnBothSides(st) {
    const top = new Set(), bot = new Set(), both = [];
    st.fracs.forEach(fr => { fr.num.forEach(f => f.t === 'u' && top.add(f.u + '^' + f.k)); fr.den.forEach(f => f.t === 'u' && bot.add(f.u + '^' + f.k)); });
    top.forEach(u => { if (bot.has(u)) both.push(u.replace(/\^1$/, '').replace('^', '<sup>') + (u.endsWith('^1') ? '' : '</sup>')); });
    return both;
  }
  const fracHTML = (t, b) => `<span class="fb-vfrac"><span>${t}</span><span>${b}</span></span>`;

  // ---------- 1. cancel and simplify ----------
  const NUMS = [2, 3, 4, 5, 6, 7, 8, 9, 10, 12, 15];
  const UNITS = ['m', 's', 'kg', 'g', 'hr', 'min', 'cm', 'L'];
  function genCancel() {
    const k = ri(2, 3);
    const fr = Array.from({ length: k }, () => ({ num: [], den: [] }));
    // matching pairs: one on top somewhere, one on the bottom somewhere else
    const pairs = [...shuffle(NUMS.slice()).slice(0, ri(2, 3)), ...shuffle(UNITS.slice()).slice(0, ri(1, 2))];
    pairs.forEach(x => { const a = ri(0, k - 1); let b = ri(0, k - 1); if (k > 1 && b === a) b = (a + 1) % k; fr[a].num.push(x); fr[b].den.push(x); });
    // leftovers: sometimes sharing a factor (like 4 over 6), so splitting is needed
    const lt = pick([4, 6, 8, 9, 3, 5, 7, 2]); let lb = pick([6, 9, 10, 3, 4, 5, 7, 2]); while (lb === lt) lb = pick([6, 9, 10, 3, 4, 5, 7, 2]);
    fr[ri(0, k - 1)].num.push(lt); fr[ri(0, k - 1)].den.push(lb);
    const u = pick(UNITS.filter(x => !pairs.includes(x)));
    fr[ri(0, k - 1)][Math.random() < 0.5 ? 'num' : 'den'].push(u);
    return fr.map(f => shuffle(f.num).join(' ') + ' / ' + shuffle(f.den).join(' '));
  }
  function checkCancel(st) {
    const both = unitsOnBothSides(st);
    if (both.length) return [false, `${both.join(', ')} can still cancel.`];
    const t = totals(st), g = bgcd(t.n, t.d);
    if (g > 1n) return [false, `Top and bottom share a factor of ${g}.`];
    return [true, 'Simplified.'];
  }

  // ---------- 2. powers of ten ----------
  const p10 = e => { const r = ri(0, 2); if (r === 0 || e > 6 || e < -4) return `10^${e}`; if (e >= 0) return '1' + '0'.repeat(e); return '0.' + '0'.repeat(-e - 1) + '1'; };
  function genPowers() {
    const k = ri(1, 2);
    const out = [];
    for (let i = 0; i < k; i++) {
      const top = Array.from({ length: ri(1, 2) }, () => p10(pick([-3, -2, 1, 2, 3, 4, 5, 6]))).filter(x => x !== '1');
      const bot = Array.from({ length: ri(1, 2) }, () => p10(pick([-2, 1, 2, 3, 4, 5]))).filter(x => x !== '1');
      out.push(top.join(' ') + ' / ' + bot.join(' '));
    }
    return out;
  }
  function checkPowers(st) {
    const t = totals(st);
    if (t.count > 1) return [false, 'Not one power of ten yet.'];
    if (t.count === 1) {
      const only = st.fracs.flatMap(fr => [...fr.num, ...fr.den]).find(f => !isUnity(f));
      if (only.t === 'n') return [false, `Write ${fh(only)} as a power of ten.`];
    }
    return [true, 'Done.'];
  }

  // ---------- 3. reach the goal ----------
  let goal = null;
  function genGoal() {
    const a = ri(1, 9), b = pick([2, 3, 4, 5, 6, 7, 8, 9].filter(x => x !== a && gcd(x, a) === 1));
    const m = ri(2, 6);
    const kind = ri(0, 2);
    if (kind === 0) { goal = [a * m, b * m]; return [`${a} / ${b}`]; }                  // build up
    if (kind === 1) { goal = [a, b]; return [`${a * m} / ${b * m}`]; }                    // reduce
    let p = ri(2, 5), q = ri(2, 5); while (p === q) q = ri(2, 5);
    goal = [a * p, b * q]; return [`${a} / ${b}`];                                          // not equal: multiply top and bottom by different factors
  }
  function checkGoal(st) {
    const t = totals(st);
    if (Object.values(t.units).some(Boolean)) return [false, 'No units here.'];
    if (st.fracs.length > 1) return [false, 'Combine into one fraction.'];
    const [gt, gb] = goal.map(BigInt);
    if (t.n === gt && t.d === gb) return [true, 'Done.'];
    if (t.n * gb === t.d * gt) return [false, 'Equal, but not the same form.'];
    return [false, `That's ${fracHTML(t.n, t.d)}`];
  }

  const EX = [
    { name: 'Cancel', task: () => 'Simplify', say: '', gen: genCancel, check: checkCancel },
    { name: 'Powers of ten', task: () => 'Simplify to one power of ten', say: '', gen: genPowers, check: checkPowers },
    { name: 'Goal', task: () => `Make <span class="goal">${fracHTML(goal[0], goal[1])}</span>`, say: '', gen: genGoal, check: checkGoal, build: true }
  ];

  const hintEl = document.getElementById('hint');
  let hintTimer = null;
  const board = FractionBoard(document.getElementById('board'), {
    onHint(t) { hintEl.textContent = t; clearTimeout(hintTimer); hintTimer = setTimeout(() => { hintEl.textContent = ''; }, 2200); },
    onChange(b) {
      document.getElementById('undo').disabled = !b.canUndo();
      document.getElementById('combine').hidden = b.fractionCount() < 2;
      if (!solved) say('');
    }
  });

  let cur = 0, solved = false, scored = false, right = 0, total = 0;
  const fbk = document.getElementById('fbk');
  function say(t, cls) { fbk.innerHTML = t; fbk.className = 'fb-feedback' + (cls ? ' ' + cls : ''); }
  function score(ok) {
    if (scored) return; scored = true; total++; if (ok) right++;
    document.getElementById('score').textContent = `${right}/${total}`;
  }
  function newProblem() {
    const ex = EX[cur];
    const spec = ex.gen();
    solved = false; scored = false;
    document.getElementById('task').innerHTML = ex.task();
    document.getElementById('build').hidden = !ex.build;
    document.getElementById('check').disabled = false;
    hintEl.textContent = '';
    board.load(spec);
    say('');
  }
  const tabs = document.getElementById('tabs');
  EX.forEach((ex, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.role = 'tab'; b.textContent = ex.name;
    b.addEventListener('click', () => { cur = i; [...tabs.children].forEach((x, j) => x.setAttribute('aria-selected', String(j === i))); newProblem(); });
    tabs.appendChild(b);
  });
  document.getElementById('check').addEventListener('click', () => {
    if (solved) return;
    const [ok, msg] = EX[cur].check(board.state);
    if (ok) { solved = true; document.getElementById('check').disabled = true; }
    // only a correct first check counts, so checking early isn't punished beyond the score
    score(ok);
    say((ok ? '✓ ' : '') + msg, ok ? 'good' : 'bad');
  });
  document.getElementById('new').addEventListener('click', newProblem);
  document.getElementById('undo').addEventListener('click', () => board.undo());
  document.getElementById('reset').addEventListener('click', () => board.reset());
  document.getElementById('combine').addEventListener('click', () => board.combine());
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !e.target.closest('input')) { e.preventDefault(); board.undo(); }
  });
  const factor = document.getElementById('factor');
  function addTo(row) {
    const v = factor.value.trim();
    if (!v) { factor.focus(); return; }
    if (!board.add(v, row)) { say('Use a whole number.', 'bad'); return; }
    factor.value = ''; factor.focus();
  }
  document.querySelectorAll('.build [data-row]').forEach(b => b.addEventListener('click', () => addTo(b.dataset.row)));
  document.getElementById('build').addEventListener('submit', e => { e.preventDefault(); addTo('num'); });

  tabs.children[0].click();
})();
</script>
