<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scientific or Not</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
:root {
  --bg: #EEF2F7; --surface: #FFFFFF; --ink: #13203A; --muted: #5F6F8A; --line: #D3DBE7;
  --accent: #2648C9; --on-accent: #FFFFFF; --good: #17804F; --bad: #C2413A;
  --good-bg: rgba(23, 128, 79, 0.10); --bad-bg: rgba(194, 65, 58, 0.10);
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1120; --surface: #131C2E; --ink: #E4EAF4; --muted: #95A4BF; --line: #26344F;
    --accent: #8AA8FF; --on-accent: #0B1120; --good: #4CC38A; --bad: #FF8F85;
    --good-bg: rgba(76, 195, 138, 0.14); --bad-bg: rgba(255, 143, 133, 0.14); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1120; --surface: #131C2E; --ink: #E4EAF4; --muted: #95A4BF; --line: #26344F;
  --accent: #8AA8FF; --on-accent: #0B1120; --good: #4CC38A; --bad: #FF8F85;
  --good-bg: rgba(76, 195, 138, 0.14); --bad-bg: rgba(255, 143, 133, 0.14); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.page { min-height: 100%; max-width: 40rem; margin: 0 auto; padding: 24px 16px 40px; display: flex; flex-direction: column; gap: 28px; }
.top { display: flex; align-items: center; gap: 6px; position: relative; }
.top a, .icon { min-width: 44px; min-height: 44px; display: grid; place-items: center; color: var(--muted); text-decoration: none; font-size: 1.1rem;
  border: 0; background: transparent; padding: 0; position: relative; }
.top a:hover, .icon:hover { color: var(--accent); }
.bar { flex: 1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin: 0 6px; position: relative; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.5s ease; }
/* a miss: the bar drops at once, and the lost piece lingers red, then drains away */
.bar b { position: absolute; top: 0; height: 100%; width: 0; background: var(--bad); }
.bar b.drain { transition: width 0.6s ease-in 0.35s; }
.bar { transition: height 0.15s ease; }
.bar.hurt { height: 7px; border-radius: 3.5px; }

.card { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 44px; padding-bottom: 10vh; }

/* ---- a number, with parts that can light up ---- */
.n { font-family: var(--f-mono); font-weight: 700; font-size: clamp(1.9rem, 9vw, 3.2rem); line-height: 1; white-space: nowrap;
  display: inline-flex; align-items: baseline; position: relative; }
.n sup { font-size: 0.55em; position: relative; top: -0.75em; vertical-align: baseline; line-height: 0; margin-left: 0.05em; }
.n .L { display: inline-flex; gap: 0.08em; }
.n .d { display: inline-block; border-radius: 0.14em; padding: 0.06em 0.04em; outline: 0.08em solid transparent; outline-offset: 0;
  transition: outline-color 0.2s, background-color 0.2s; }
.n .x { margin-left: 0.35em; border-bottom: 0.08em solid transparent; padding-bottom: 0.06em; transition: border-color 0.2s; }
.n .ghost { margin-left: 0.35em; color: var(--muted); display: none; position: relative; white-space: nowrap; animation: fadein 0.25s ease;
  border: 0.06em dashed currentColor; border-radius: 0.18em; padding: 0.1em 0.2em; font-size: 0.8em; }
.n .ghost::after { content: ""; position: absolute; left: -8%; right: -8%; top: 50%; height: 0.08em; background: var(--bad); transform: rotate(-12deg); }
@keyframes fadein { from { opacity: 0; } }

/* what makes it scientific: one digit before the point, and × 10ⁿ */
.n.why-sci .L .d { outline-color: var(--good); background: var(--good-bg); }
.n.why-sci .x { border-color: var(--good); }
/* what makes it neither: × 10ⁿ, but more than one digit before the point */
.n.why-fake .L .d { outline-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.n.why-fake .x { border-color: var(--good); }
/* what makes it a decimal: no × 10ⁿ */
.n.why-dec .ghost { display: inline-block; opacity: 0.85; }
/* it has a power of ten: so it isn't a plain decimal */
.n.why-pow .x { border-color: var(--good); color: var(--good); }
/* one digit before the point is fine */
.n.why-one .L .d { outline-color: var(--good); background: var(--good-bg); }

/* ---- answers ---- */
.opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: min(100%, 32rem); }
.opts button { min-height: 60px; padding: 8px 6px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface);
  font-weight: 700; font-size: 1.02rem; transition: border-color 0.15s, color 0.15s, opacity 0.15s; }
.opts button:hover:not(:disabled) { border-color: var(--accent); }
.opts button:disabled { cursor: default; opacity: 0.4; }
.opts button.ok { opacity: 1; border-color: var(--good); color: var(--good); background: var(--good-bg); }
.opts button.no { opacity: 1; border-color: var(--bad); color: var(--bad); }
.opts button.ok::before { content: "✓ "; }
.opts button.want { opacity: 1; border-color: var(--good); color: var(--good); }
.fix { display: flex; flex-direction: column; align-items: center; gap: 18px; min-height: 110px; margin-top: -18px; }
.fix p { margin: 0; max-width: 26rem; text-align: center; font-size: 1.12rem; line-height: 1.45; }
.fix .ok-btn { min-height: 46px; min-width: 120px; padding: 0 28px; border-radius: 999px; border: 0; background: var(--accent); color: var(--on-accent); font-weight: 700; }

/* ---- the key (re-findable reference) ---- */
.key { position: absolute; top: 52px; right: 0; z-index: 10; margin: 0; padding: 18px 20px; border-radius: 16px; background: var(--surface);
  box-shadow: 0 0 0 1px var(--line), 0 12px 32px rgba(10, 20, 40, 0.14); display: grid; grid-template-columns: auto auto; gap: 16px 22px; align-items: center; }
.key .n { font-size: 1.35rem; justify-self: end; }
.key b { font-size: 0.95rem; color: var(--muted); }

/* ---- done ---- */
.done { display: flex; flex-direction: column; align-items: center; gap: 24px; }
.done .mark { width: 88px; height: 88px; border-radius: 50%; display: grid; place-items: center; font-size: 2.6rem; color: var(--good); background: var(--good-bg); }
.done nav { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.done a, .done button { min-height: 46px; padding: 0 24px; border-radius: 999px; display: inline-grid; place-items: center; font-weight: 700; text-decoration: none; }
.done .go { border: 0; background: var(--accent); color: var(--on-accent); }
.done .again { border: 2px solid var(--line); background: var(--surface); color: var(--ink); }

.corner { position: fixed; right: 0; bottom: 0; width: 44px; height: 44px; display: grid; place-items: center; }
.corner::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); opacity: 0.35; }
.corner:hover::after, .corner:focus-visible::after { opacity: 1; }
@media (max-width: 380px) { .opts button { font-size: 0.92rem; } }
@media (prefers-reduced-motion: reduce) {
  .bar i, .n .d, .n .x { transition: none; }
  .bar b.drain { transition: opacity 0.4s ease 0.5s; opacity: 0; width: var(--lost) !important; }
  .n .ghost { animation: none; }
}
</style>

<div class="page">
  <div class="top">
    <a href="../index.html" aria-label="Apparatus">←</a>
    <div class="bar" role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100" id="barWrap"><i id="bar"></i><b id="hit"></b></div>
    <button type="button" class="icon" id="help" aria-label="Key" aria-expanded="false" aria-controls="key">?</button>
    <div class="key" id="key" role="dialog" aria-label="Key" hidden></div>
  </div>
  <div class="card" id="card">
    <div id="q"></div>
    <div class="opts" id="opts" role="group" aria-label="Which is it?">
      <button type="button" data-a="dec">Decimal</button>
      <button type="button" data-a="sci">Scientific</button>
      <button type="button" data-a="none">Neither</button>
    </div>
    <div class="fix"><p id="why" aria-live="polite"></p><button type="button" class="ok-btn" id="okBtn" hidden>OK</button></div>
    <p class="sr" id="say" aria-live="polite"></p>
  </div>
  <div class="card" id="fin" hidden>
    <div class="done">
      <div class="mark" aria-hidden="true">✓</div>
      <nav>
        <button type="button" class="again" id="again">Again</button>
        <a class="go" href="../index.html">Done</a>
      </nav>
    </div>
  </div>
  <a class="corner" href="../analytics.html#sci-form" aria-label="Analytics"></a>
</div>

<script>
(function () {
  // ================= the numbers =================
  const r = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const digits = n => Array.from({ length: n }, (_, i) => String(i ? r(0, 9) : r(1, 9))).join('');
  const frac = n => digits(n).replace(/0+$/, '');            // no trailing zeros after the point
  const exp = (lo, hi, neg) => (neg ? -1 : 1) * r(lo, hi);
  // a number: { L: digits before the point, R: digits after (may be ''), e: exponent or null }
  const KINDS = {
    // decimals
    'dec-whole':  { a: 'dec', make: () => ({ L: digits(r(3, 7)), R: '', e: null }) },
    'dec-point':  { a: 'dec', make: () => ({ L: digits(r(2, 3)), R: frac(r(1, 2)), e: null }) },
    'dec-small':  { a: 'dec', make: () => ({ L: '0', R: '0'.repeat(r(1, 3)) + digits(r(1, 2)), e: null }) },
    'dec-one':    { a: 'dec', make: () => ({ L: String(r(1, 9)), R: frac(r(1, 3)) || '5', e: null }) },      // looks like the front of scientific
    // scientific
    'sci-big':    { a: 'sci', make: () => ({ L: String(r(1, 9)), R: frac(r(1, 3)) || '2', e: exp(2, 9) }) },
    'sci-small':  { a: 'sci', make: () => ({ L: String(r(1, 9)), R: frac(r(1, 3)) || '4', e: exp(2, 8, true) }) },
    'sci-bare':   { a: 'sci', make: () => ({ L: String(r(1, 9)), R: '', e: exp(3, 9, Math.random() < 0.4) }) },
    // neither: × 10ⁿ, but more than one digit before the point
    'fake-big':   { a: 'none', make: () => ({ L: digits(r(2, 3)), R: frac(r(1, 2)), e: exp(2, 8) }) },
    'fake-small': { a: 'none', make: () => ({ L: digits(r(2, 3)), R: Math.random() < 0.5 ? frac(r(1, 2)) : '', e: exp(2, 7, true) }) },
    'fake-ten':   { a: 'none', make: () => ({ L: '10', R: frac(r(1, 2)), e: exp(2, 8, Math.random() < 0.4) }) }   // 10.x looks almost right
  };
  // Three ideas, one per answer. Hard kinds vouch for the easy ones; easy kinds are only for after a miss.
  const IDEAS = {
    dec:  { easy: ['dec-whole', 'dec-point'], hard: ['dec-one', 'dec-small'] },
    sci:  { easy: ['sci-big'], hard: ['sci-small', 'sci-bare'] },
    none: { easy: ['fake-big'], hard: ['fake-ten', 'fake-small'] }
  };
  // the first three: one of each, the same digits, so only the form changes
  const OPENING = [
    { kind: 'sci-big',   n: { L: '4', R: '56', e: 3 } },
    { kind: 'fake-big',  n: { L: '45', R: '6', e: 2 } },
    { kind: 'dec-whole', n: { L: '4560', R: '', e: null } }
  ];
  // then the hard ones, never the same idea twice in a row
  const PROBE = ['dec-one', 'fake-ten', 'sci-small', 'fake-small', 'dec-small', 'sci-bare'];

  const commas = s => s.length > 3 ? s.replace(/\B(?=(\d{3})+(?!\d))/g, ',') : s;
  const supNum = e => (e < 0 ? '−' : '') + Math.abs(e);
  const SUP = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '−': '⁻' };
  const text = n => (n.e === null ? commas(n.L) : n.L) + (n.R ? '.' + n.R : '') + (n.e === null ? '' : ' × 10' + Array.from(supNum(n.e)).map(c => SUP[c]).join(''));
  function render(n, opts) {
    // decimals over 999 get commas; the digits before the point each get a box so they can be counted
    const L = n.e === null ? commas(n.L) : n.L;
    const ds = Array.from(L).map(c => c === ',' ? ',' : `<span class="d">${c}</span>`).join('');
    const pt = n.R ? `.${n.R}` : '';
    const x = n.e === null ? `<span class="ghost" aria-hidden="true">× 10<sup>?</sup></span>` : `<span class="x">× 10<sup>${supNum(n.e)}</sup></span>`;
    return `<span class="n${opts ? ' ' + opts : ''}"><span class="L">${ds}</span>${pt}${x}</span>`;
  }
  const spoken = n => `${n.L}${n.R ? ' point ' + n.R : ''}${n.e === null ? '' : ' times 10 to the ' + (n.e < 0 ? 'minus ' : '') + Math.abs(n.e)}`;
  const WHY = { sci: 'why-sci', none: 'why-fake', dec: 'why-dec' };
  const NAME = { sci: 'Scientific', none: 'Neither', dec: 'Decimal' };
  // after a miss: show why the CHOSEN answer is wrong — one cue on the number, one plain sentence
  function feedback(n, want, chose) {
    const x = `× 10<sup>${n.e === null ? 'n' : supNum(n.e)}</sup>`;
    if (chose === 'dec') return ['why-pow', `It has ${x}, so it’s not a decimal.`];
    if (want === 'dec') return ['why-dec', chose === 'sci' ? `There’s no ${x}, so it’s not scientific notation.` : `There’s no ${x}. A plain number is a decimal.`];
    if (want === 'none') return ['why-fake', `There are ${n.L.length} digits (${n.L}) before the point. Scientific notation has just one.`];
    return ['why-sci', `One digit (${n.L}) before the point, then ${x}. That’s scientific notation.`];   // want sci, chose neither
  }

  // ================= state (shared with ../analytics.html) =================
  // run:  where this pass is — opening index, hard kinds still to probe, and per idea how many right answers are
  //       still needed after a miss (a miss sets 2: one easier, then the kind that was missed)
  // warm: a short check at the start of a later session (one hard kind per idea)
  // log:  every answer, for the analytics page
  const KEY = 'apparatus.sci-form.v2';
  const WARM_AFTER = 8 * 3600e3;              // a "later session" is 8+ hours after the last finish
  const newRun = () => ({ open: 0, probe: PROBE.slice(), need: { dec: 0, sci: 0, none: 0 }, missed: {}, answers: 0, credit: 0 });
  let S;
  function load() {
    try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) { S = null; }
    if (!S || !S.run) S = { run: newRun(), warm: null, done: false, doneAt: null, checkedAt: null, log: [] };
  }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = r(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const any = a => a[r(0, a.length - 1)];

  let cur = null, lastIdea = null;
  function pick() {
    const R = S.run;
    if (R.open < OPENING.length) { const o = OPENING[R.open]; return { kind: o.kind, n: o.n, mode: 'open' }; }
    // a missed idea first, unless it was just asked and something else can go between
    const needy = Object.keys(R.need).filter(i => R.need[i] > 0);
    const other = S.warm && S.warm.length ? S.warm[0] : R.probe[0];
    let idea = needy.find(i => i !== lastIdea) || (needy.length && !other ? needy[0] : null);
    if (idea) {
      const kind = R.need[idea] >= 2 ? any(IDEAS[idea].easy) : R.missed[idea];
      return { kind, n: KINDS[kind].make(), mode: 'fix' };
    }
    if (S.warm && S.warm.length) return { kind: S.warm[0], n: KINDS[S.warm[0]].make(), mode: 'warm' };
    if (R.probe.length) return { kind: R.probe[0], n: KINDS[R.probe[0]].make(), mode: 'probe' };
    if (needy.length) { const kind = R.need[needy[0]] >= 2 ? any(IDEAS[needy[0]].easy) : R.missed[needy[0]]; return { kind, n: KINDS[kind].make(), mode: 'fix' }; }
    return null;
  }
  const remaining = () => { const R = S.run; return (OPENING.length - R.open) + R.probe.length + (S.warm ? S.warm.length : 0) + Object.values(R.need).reduce((a, b) => a + b, 0); };

  function grade(chose, right, ms) {
    const R = S.run, idea = KINDS[cur.kind].a;
    S.log.push({ at: Date.now(), kind: cur.kind, idea, txt: text(cur.n), chose, right, ms, mode: cur.mode, key: keyUsed });
    R.answers++;
    if (cur.mode === 'open') R.open++;
    if (cur.mode === 'probe') R.probe = R.probe.filter(k => k !== cur.kind);
    if (cur.mode === 'warm') S.warm.shift();
    // progress = right answers against what's left; a miss also costs one, so the bar always drops
    R.credit = Math.max(0, (R.credit || 0) + (right ? 1 : -1));
    if (right) { if (R.need[idea] > 0) R.need[idea]--; }
    else { R.need[idea] = 2; R.missed[idea] = cur.kind; }
    lastIdea = idea;
    save();
  }
  let shown = null;
  function progress() {
    const done = S.run.credit || 0, left = remaining();
    const pct = done + left ? 100 * done / (done + left) : 100;
    const bar = $('bar'), hit = $('hit');
    if (shown !== null && pct < shown - 0.5) {
      bar.style.transition = 'none';                               // drop now…
      hit.className = ''; hit.style.left = pct + '%'; hit.style.width = (shown - pct) + '%';
      hit.style.setProperty('--lost', (shown - pct) + '%'); hit.style.opacity = '';
      void hit.offsetWidth;
      hit.className = 'drain'; hit.style.width = '0';               // …then the red piece drains
      const wrap = $('barWrap'); wrap.classList.add('hurt'); clearTimeout(progress.t);
      progress.t = setTimeout(() => wrap.classList.remove('hurt'), 900);
    }
    bar.style.width = pct + '%'; void bar.offsetWidth; bar.style.transition = '';
    shown = pct; $('barWrap').setAttribute('aria-valuenow', Math.round(pct));
  }

  // ================= the page =================
  const $ = id => document.getElementById(id);
  const btns = Array.from(document.querySelectorAll('#opts button'));
  let state = 'ask', tick = 0, shownAt = 0, keyUsed = false;   // ask → (right: wait → next) | (wrong: fix → OK → next)

  function finish() {
    const now = Date.now();
    if (!S.done) { S.done = true; S.doneAt = now; }
    if (S.warm) {
      // a clean check is final; a check with a miss runs again next session
      const missed = S.log.slice(-S.run.answers).some(x => x.mode !== 'open' && !x.right);
      S.warm = null; S.warmAt = now;
      if (missed) S.checkMissed = true; else { S.checkedAt = now; S.checkMissed = false; }
    }
    save(); progress();
    $('card').hidden = true; $('fin').hidden = false; $('again').focus();
  }
  function next() {
    progress();
    cur = pick();
    if (!cur) return finish();
    $('card').hidden = false; $('fin').hidden = true;
    $('q').innerHTML = render(cur.n);
    $('say').textContent = spoken(cur.n);
    btns.forEach(b => { b.disabled = false; b.className = ''; });
    $('why').textContent = ''; $('okBtn').hidden = true;
    state = 'ask'; shownAt = performance.now(); keyUsed = !$('key').hidden;
  }

  function answer(a) {
    if (state !== 'ask') return;
    const right = a === KINDS[cur.kind].a;
    grade(a, right, Math.round(performance.now() - shownAt));
    progress();
    if (right) {
      state = 'wait';
      btns.forEach(b => { b.disabled = true; if (b.dataset.a === a) b.className = 'ok'; });
      $('say').textContent = 'Correct.';
      const t = ++tick;
      setTimeout(() => { if (t === tick) next(); }, 900);
    } else {
      state = 'fix';
      const want = KINDS[cur.kind].a;
      btns.forEach(b => { b.disabled = true; b.className = b.dataset.a === a ? 'no' : b.dataset.a === want ? 'want' : ''; });
      const [cue, say] = feedback(cur.n, want, a);
      $('q').firstElementChild.classList.add(cue);
      $('why').innerHTML = say;
      $('okBtn').hidden = false;
      $('okBtn').focus();
    }
  }

  btns.forEach(b => b.addEventListener('click', () => answer(b.dataset.a)));
  $('okBtn').addEventListener('click', () => { if (state === 'fix') next(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !$('key').hidden) { toggleKey(false); $('help').focus(); return; }
    if (e.metaKey || e.ctrlKey || e.altKey || !$('fin').hidden) return;
    const a = { '1': 'dec', '2': 'sci', '3': 'none', d: 'dec', s: 'sci', n: 'none' }[e.key.toLowerCase()];
    if (a) { e.preventDefault(); answer(a); }
  });

  // ---- the key: one example of each, with what decides it lit up (opening it is noted in the log) ----
  $('key').innerHTML = [['dec', { L: '4560', R: '', e: null }], ['sci', { L: '4', R: '56', e: 3 }], ['none', { L: '45', R: '6', e: 2 }]]
    .map(([a, n]) => render(n, WHY[a]) + `<b>${NAME[a]}</b>`).join('');
  function toggleKey(on) {
    $('key').hidden = !on; $('help').setAttribute('aria-expanded', String(on));
    if (on && state === 'ask') keyUsed = true;
  }
  $('help').addEventListener('click', e => { e.stopPropagation(); toggleKey($('key').hidden); });
  document.addEventListener('click', e => { if (!$('key').hidden && !$('key').contains(e.target)) toggleKey(false); });

  $('again').addEventListener('click', () => { tick++; S.run = newRun(); S.warm = null; lastIdea = null; shown = null; save(); next(); });

  function start() {
    tick++; load(); lastIdea = null; shown = null;
    // a later session after finishing: a quick warm-up, one hard kind per idea
    const since = Math.max(S.doneAt || 0, S.warmAt || 0);
    if (S.done && !S.checkedAt && !S.warm && remaining() === 0 && Date.now() - since > WARM_AFTER) {
      S.warm = shuffle(Object.keys(IDEAS).map(i => any(IDEAS[i].hard)));
      S.run.answers = 0; S.run.credit = 0; save();
    }
    if (S.done && remaining() === 0) { progress(); $('card').hidden = true; $('fin').hidden = false; return; }
    next();
  }
  start();
  // coming back from the analytics page (which can change the state)
  window.addEventListener('pageshow', e => { if (e.persisted) start(); });
  if (/[?&]debug\b/.test(location.search)) window.sf = { S: () => S, cur: () => cur, KINDS, render, start };
})();
</script>
